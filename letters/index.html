<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, made for a four-year-old's thumb and a parent beside him.
   IDEA: a little cartoon theatre: a stage with a curtain colour per letter, where words "perform" one after another.
   PICTURE: the stage itself: a huge photo card that pops in, the Arabic word drawing itself, stars flying on a right answer.
   COLOUR and TYPE: each letter owns its stage colour (blue, orange, purple, green, red, teal, violet, indigo, sunset); white cards; red first letter; sunny yellow stars; Baloo 2 + Baloo Bhaijaan 2.
   LAYOUT: home = big letter tiles + two giant mode buttons; watch = full-height stage with controls under it; play = sound button over a 2x2 picture grid. */
:root{color-scheme:light;--c:#1e88e5;--ink:#1d1d24;--soft:#5f6368;--sun:#ffc107;--red:#d32f2f;--blue:#1565c0}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--c);color:var(--ink);font:17px/1.45 "Baloo 2",system-ui,sans-serif;overflow-x:clip;transition:background .5s}
.ar{font-family:"Baloo Bhaijaan 2","Baloo 2",sans-serif;direction:rtl}
.view{display:none;min-height:100%;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px 18px}
.view.on{display:flex}
.wrap{width:100%;max-width:760px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles i{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:float 14s linear infinite}
@keyframes float{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.view>*{position:relative;z-index:1}
/* home */
.hero{color:#fff;text-align:center;margin:10px 0 4px}
.hero h1{font-size:clamp(34px,8vw,52px);line-height:1.05;margin:0;text-wrap:balance}
.hero .ar{display:block;font-size:.75em;opacity:.9}
.hero p{margin:8px auto 0;max-width:36ch;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:18px 0;direction:rtl}
.tile{background:#fff;border-radius:22px;aspect-ratio:1;display:grid;place-items:center;font:800 clamp(34px,9vw,54px)/1 "Baloo Bhaijaan 2",sans-serif;color:var(--tc);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .15s}
.tile div{display:flex;flex-direction:column;align-items:center;line-height:1.25}.tile small{display:block;font:700 12px/1 "Baloo 2",sans-serif;color:var(--soft);margin-top:2px}.tile .w{font-size:.42em}
.tile[aria-pressed=true]{transform:translateY(-4px) scale(1.06);outline:5px solid var(--sun)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{background:#fff;border-radius:26px;padding:18px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.18);font-weight:800;font-size:24px;color:var(--ink)}
.mode svg{width:62px;height:62px}
.mode span{font-size:15px;font-weight:600;color:var(--soft);line-height:1.2;text-align:center}
.picked{color:#fff;text-align:center;margin-top:12px;font-weight:700}
/* shared top bar */
.bar{width:100%;max-width:760px;display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
.round{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.round svg{width:24px;height:24px}
.bar .t{flex:1;font-weight:800;font-size:20px;line-height:1.1}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:50%}
.dots b{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots b.on{background:#fff}
/* watch stage */
.stage{width:100%;max-width:520px;background:#fff;border-radius:30px;box-shadow:0 8px 0 rgba(0,0,0,.18);overflow:hidden;text-align:center;position:relative}
.stage .ph{aspect-ratio:1/1;background:#fff;overflow:hidden;position:relative}
.stage .ph img{width:100%;height:100%;object-fit:cover;display:block}
.stage .ph.ill img{object-fit:contain;padding:18px}
.stage .word{font-size:clamp(52px,15vw,84px);font-weight:800;line-height:1.2;margin-top:4px;min-height:1.25em}
.stage .word .r{color:var(--red)}
.stage .word{clip-path:inset(0 0 0 100%)}.stage .word.write{animation:write 1.1s ease-out forwards}@keyframes write{to{clip-path:inset(0 0 0 0)}}.stage .word b{color:var(--red);font-weight:800}
.stage .pr{color:var(--blue);font-weight:800;font-size:24px;line-height:1.1;opacity:0}
.stage .en{color:var(--soft);font-size:17px;padding-bottom:16px;opacity:0}
.badge{position:absolute;top:12px;right:12px;width:62px;height:62px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 36px/1 "Baloo Bhaijaan 2",sans-serif;z-index:2;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.intro{padding:34px 16px 30px}
.intro .big{width:min(62vw,280px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 clamp(110px,34vw,170px)/1 "Baloo Bhaijaan 2",sans-serif}
.intro h2{font-size:38px;margin:14px 0 0;line-height:1.1}
.intro p{margin:4px 0 0;color:var(--soft);font-size:18px}
.ctrl{display:flex;gap:14px;justify-content:center;margin-top:16px}
.ctrl .round{width:62px;height:62px}
.ctrl .round.main{width:74px;height:74px;background:var(--sun)}
.ctrl svg{width:30px;height:30px}
.go-pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
.go-zoom img{animation:zoom 4.5s ease-out both}
.go-up{animation:up .4s ease-out both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes zoom{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
/* play */
.ask{width:100%;max-width:520px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.18);margin-bottom:14px}
.ask .spk{width:76px;height:76px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.ask .spk svg{width:40px;height:40px}
.ask .spk.ring{animation:ring 1s ease-in-out}
@keyframes ring{25%{transform:scale(1.12)}50%{transform:scale(.96)}75%{transform:scale(1.06)}}
.ask .q{flex:1;font-weight:800;font-size:20px;line-height:1.2}
.ask .q small{display:block;font-weight:600;color:var(--soft);font-size:15px}
.stars{color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;gap:4px}
.stars svg{width:26px;height:26px}

.opt{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative;padding:0;aspect-ratio:1;transition:transform .15s}
.opt img{width:100%;height:100%;object-fit:cover;display:block}
.opt.ill img{object-fit:contain;padding:12px}
.opt.right{outline:7px solid #43a047;transform:scale(1.04)}
.opt.wrong{animation:shake .45s;opacity:.45}
.opt .lab{position:absolute;inset:auto 0 0;background:rgba(255,255,255,.94);font:800 30px/1.3 "Baloo Bhaijaan 2",sans-serif;direction:rtl;text-align:center;transform:translateY(100%);transition:transform .3s}
.opt.right .lab{transform:none}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.done{width:100%;max-width:520px;background:#fff;border-radius:30px;padding:30px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.done h2{font-size:40px;margin:0;line-height:1.1}
.done .big{font-size:64px;font-weight:800;color:var(--c);line-height:1}
.done p{color:var(--soft);margin:6px 0 18px}
.pill{background:var(--c);color:#fff;border-radius:999px;min-height:54px;padding:6px 26px;font-weight:800;font-size:20px;margin:6px}
.pill.alt{background:#eef0f4;color:var(--ink)}
#opts{display:grid;gap:12px;position:relative}
.opt .lab{display:none}.opt.right .lab{display:block}
.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.st-two{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-list,.st-wballoon{grid-template-columns:1fr}
.st-letters{grid-template-columns:repeat(2,minmax(0,1fr))}
.lopt{background:#fff;border-radius:24px;aspect-ratio:1.3;font-size:64px;font-weight:800;color:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.lopt.right,.yn.right{outline:7px solid #43a047}.lopt.wrong,.yn.wrong{animation:shake .45s;opacity:.45}
.yn{border-radius:28px;aspect-ratio:1;font-size:80px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}.yn.yes{background:#43a047}.yn.no{background:#e53935}
.st-balloon,.st-bubble,.st-cloud,.st-star,.st-fish,.st-fall{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:18px}
.st-star{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-balloon .opt{border-radius:50% 50% 46% 46%;aspect-ratio:.85;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d);overflow:visible}
.st-balloon .opt img{border-radius:50% 50% 46% 46%}
.st-balloon .opt::after{content:"";position:absolute;left:50%;bottom:-24px;width:2px;height:24px;background:rgba(255,255,255,.85)}
.st-bubble .opt{border-radius:50%;animation:rise 3s ease-in-out infinite;animation-delay:var(--d);box-shadow:inset 0 0 0 6px rgba(255,255,255,.7),0 6px 14px rgba(0,0,0,.2)}
.st-bubble .opt img{border-radius:50%}
.st-cloud .opt{border-radius:40% 45% 35% 40%/50%;animation:drift 4s ease-in-out infinite;animation-delay:var(--d);box-shadow:0 0 0 8px #fff,0 8px 0 8px rgba(0,0,0,.12)}
.st-star .opt{animation:twinkle 1.8s ease-in-out infinite;animation-delay:var(--d);clip-path:polygon(50% 0,63% 34%,100% 36%,71% 58%,81% 100%,50% 76%,19% 100%,29% 58%,0 36%,37% 34%);border-radius:0;aspect-ratio:1}
.st-fish .opt{border-radius:50% 40% 40% 50%/50%;animation:swim 3.2s ease-in-out infinite;animation-delay:var(--d);overflow:visible}
.st-fish .opt img{border-radius:50% 40% 40% 50%/50%}
.st-fish .opt::after{content:"";position:absolute;right:-22px;top:30%;border:20px solid transparent;border-left:26px solid #ff9800;border-right:0}
.st-fall{min-height:300px;align-items:start}
.st-fall .opt{animation:fall 3.4s linear infinite;animation-delay:calc(var(--d)*-2)}
.st-train{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:16px 4px 26px;background:linear-gradient(transparent calc(100% - 10px),#6d4c41 0);animation:chug 1s ease-in-out infinite}
.st-train .opt{border-radius:10px;box-shadow:0 0 0 5px #e53935,0 8px 0 5px #b71c1c;overflow:visible}
.st-train .opt::after{content:"● ●";position:absolute;left:0;right:0;bottom:-26px;text-align:center;color:#263238;font-size:20px;letter-spacing:12px}
.st-gift{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:30px}
.st-gift .opt{border-radius:12px;box-shadow:0 0 0 6px #ec407a;animation:wiggle 2.2s ease-in-out infinite;animation-delay:var(--d);overflow:visible}
.st-gift .opt::before{content:"";position:absolute;left:44%;top:-10px;bottom:-10px;width:12%;background:#ffc107;opacity:.85;z-index:1}
.st-gift .opt::after{content:"🎀";position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2}
.st-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-cards .opt img{opacity:0;transition:opacity .3s}
.st-cards .opt{background:repeating-linear-gradient(45deg,var(--c) 0 14px,#fff 14px 20px)}
.st-cards .opt.open,.st-cards .opt.right{background:#fff}.st-cards .opt.open img,.st-cards .opt.right img{opacity:1}
.st-wballoon .wopt{border-radius:50px;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes rise{50%{transform:translateY(-16px) scale(1.04)}}
@keyframes drift{50%{transform:translateX(10px)}}
@keyframes twinkle{50%{transform:scale(.88);filter:brightness(1.25)}}
@keyframes swim{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}}
@keyframes fall{0%{transform:translateY(-40px)}50%{transform:translateY(90px)}100%{transform:translateY(-40px)}}
@keyframes chug{50%{transform:translateX(6px)}}
@keyframes wiggle{0%,80%,100%{transform:none}85%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
.ask .q{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qt{display:block;font-weight:800;font-size:19px;line-height:1.2;flex:1;min-width:120px}.qt small{display:block;font-weight:600;color:var(--soft);font-size:14px}
.qimg{width:116px;height:116px;object-fit:cover;border-radius:18px;flex:none;background:#fff}.qimg.ill{object-fit:contain}
.qimg.blur{animation:unblur 7s ease-out forwards}@keyframes unblur{from{filter:blur(14px)}to{filter:blur(2px)}}
.zoomwrap,.peekwrap{position:relative;width:116px;height:116px;border-radius:18px;overflow:hidden;flex:none;display:block}
.zoomwrap .qimg{animation:zoomout 9s ease-out forwards;transform-origin:35% 40%}@keyframes zoomout{from{transform:scale(4)}to{transform:scale(1.2)}}
.peekwrap i{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#c62828 0 10px,#e53935 10px 20px);animation:curtainL 7s ease-in forwards}
.peekwrap i:first-of-type{left:0}.peekwrap i:last-of-type{right:0;animation-name:curtainR}
@keyframes curtainL{to{transform:translateX(-80%)}}@keyframes curtainR{to{transform:translateX(80%)}}
.bigw{font-size:46px;font-weight:800;line-height:1.2;color:var(--ink)}.bigw .gap{color:var(--red);display:inline-block;min-width:.8em;border-bottom:4px dashed var(--red)}
.st-lily,.st-egg,.st-kite,.st-tv{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:14px}
.st-frame,.st-hex,.st-shelf,.st-house{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-lily .opt{border-radius:50%;box-shadow:0 0 0 8px #43a047,0 10px 0 8px #2e7d32;animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.st-lily .opt img{border-radius:50%}
.st-frame .opt{border-radius:6px;box-shadow:0 0 0 10px #c9a227,0 0 0 14px #8d6e1a,0 10px 18px 14px rgba(0,0,0,.25);margin:12px;transform:rotate(calc((var(--i) - 1.5) * 2deg))}
.st-egg .opt{border-radius:50% 50% 50% 50%/60% 60% 40% 40%;aspect-ratio:.8;box-shadow:0 0 0 6px #fff8e1,0 8px 0 6px rgba(0,0,0,.15);animation:wobble 2.6s ease-in-out infinite;animation-delay:var(--d)}
.st-egg .opt img{border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.st-hex .opt{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);border-radius:0;aspect-ratio:1.1;box-shadow:none;background:#ffb300}
.st-hex .opt img{clip-path:polygon(25% 7%,75% 7%,96% 50%,75% 93%,25% 93%,4% 50%)}
.st-shelf{background:linear-gradient(transparent calc(50% - 10px),#8d6e63 calc(50% - 10px) 50%,transparent 50% calc(100% - 10px),#8d6e63 calc(100% - 10px));padding:10px 10px 14px;border-radius:12px}
.st-shelf .opt{border-radius:6px 6px 0 0;aspect-ratio:.8;margin-bottom:10px;box-shadow:inset 0 0 0 6px var(--c)}
.st-house{background:#ffccbc;padding:16px;border-radius:12px 12px 0 0;position:relative;margin-top:44px}
.st-house::before{content:"";position:absolute;left:-10px;right:-10px;top:-44px;height:46px;background:#c62828;clip-path:polygon(50% 0,100% 100%,0 100%)}
.st-house .opt{border-radius:4px;box-shadow:0 0 0 6px #fff,0 0 0 9px #6d4c41}
.st-kite .opt{transform:rotate(45deg) scale(.78);border-radius:8px;box-shadow:0 0 0 6px var(--c);animation:fly 3s ease-in-out infinite;animation-delay:var(--d);overflow:hidden}
.st-kite .opt img{transform:rotate(-45deg) scale(1.42)}
.st-tv .opt{border-radius:14px;box-shadow:0 0 0 8px #37474f,0 14px 0 8px #263238}
.st-tv .opt::after{content:"";position:absolute;left:35%;right:35%;bottom:-24px;height:10px;background:#263238;border-radius:4px}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes fly{0%,100%{transform:rotate(45deg) scale(.78) translateY(0)}50%{transform:rotate(40deg) scale(.78) translate(-6px,-8px)}}
#opts[class*="st-"]{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:22px}
#opts[class*="st-"]>.opt:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 9px)}
.st-kite{padding:20px}
.arena{width:100%;max-width:620px;display:flex;gap:12px;align-items:stretch}
.pmain{flex:1;min-width:0}
.ladder{width:76px;flex:none;position:relative;background:rgba(255,255,255,.18);border-radius:18px;min-height:420px}
.rails{position:absolute;inset:14px 12px 10px;border-left:6px solid #8d6e63;border-right:6px solid #8d6e63;background:repeating-linear-gradient(to top,transparent 0 calc(10% - 5px),#a1887f calc(10% - 5px) 10%)}
.flag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:26px}
.climber{position:absolute;left:50%;transform:translateX(-50%);font-size:40px;line-height:1;transition:bottom .6s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.climber.up{animation:hop .6s}.climber.down{animation:slip .6s}
@keyframes hop{40%{transform:translateX(-50%) translateY(-14px) scale(1.15)}}
@keyframes slip{30%{transform:translateX(-50%) rotate(-18deg)}60%{transform:translateX(-50%) rotate(14deg)}}
#opts{display:grid;gap:12px}
.opts.balloon{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:20px}
.opts.balloon .opt{border-radius:50% 50% 46% 46%;aspect-ratio:.85;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d);overflow:visible;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.opts.balloon .opt img{border-radius:50% 50% 46% 46%}
.opts.balloon .opt::after{content:"";position:absolute;left:50%;bottom:-26px;width:2px;height:26px;background:rgba(255,255,255,.8)}
.opts.balloon .opt.right{animation:popb .5s forwards}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes popb{60%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.wopt{background:#fff;border-radius:22px;min-height:76px;font-size:40px;font-weight:800;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.wopt.right{outline:7px solid #43a047}.wopt.wrong{animation:shake .45s;opacity:.45}
.qimg{width:120px;height:120px;object-fit:cover;border-radius:18px;flex:none}.qimg.ill{object-fit:contain;background:#fff}
.ask .q{display:flex;align-items:center;gap:12px}
.bigl{font-size:64px;line-height:1;color:var(--c);font-weight:800;flex:none;min-width:60px;text-align:center}
.winner{font-size:110px;line-height:1.1;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@media(max-width:420px){.ladder{width:60px}.climber{font-size:32px}.qimg{width:92px;height:92px}.bigl{font-size:52px}.wopt{font-size:34px;min-height:66px}.ask .spk{width:60px;height:60px}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.cred{color:#fff;margin-top:22px;font-size:13px;opacity:.85}.cred summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}.cred a{color:#fff;overflow-wrap:anywhere}.cred ul{padding-inline-start:18px;margin:4px 0}.hint{color:#fff;opacity:.9;font-size:15px;margin-top:12px;text-align:center}
@media(max-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:420px){.mode{min-height:130px;font-size:21px}}
@media(prefers-reduced-motion:reduce){.stage .word{clip-path:none}*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.bubbles{display:none}}

/* fit on any screen */
.view{min-height:100dvh}
#opts{width:100%;max-width:min(100%,calc(100dvh - 250px));margin:0 auto}
.ladder{min-height:0;height:min(520px,calc(100dvh - 120px));align-self:flex-start;position:sticky;top:10px}
.stage{max-width:min(520px,calc(100dvh - 340px))}
.stage .word{font-size:clamp(40px,min(12vw,8dvh),84px)}
.arena{max-width:760px}
@media(min-width:900px){.ask{max-width:none}}
@media(max-height:560px){.ask .spk{width:56px;height:56px}.ask{padding:8px 12px;margin-bottom:8px}}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const marks=/[ً-ْٰ]/;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SECS=D.S;const ALL={items:D.S.flatMap(s=>s.items)};
let cur=SECS[0];

$('bub').innerHTML=Array.from({length:9},(_,i)=>`<i style="left:${(i*37)%100}%;width:${40+(i*23)%70}px;height:${40+(i*23)%70}px;animation-delay:-${i*1.6}s;animation-duration:${12+(i%4)*3}s"></i>`).join('');

const player=new Audio();let token=0;
let AUD={};try{fetch('audio.json').then(r=>r.ok?r.json():{}).then(j=>{AUD=j||{}}).catch(()=>{})}catch(e){}
function say(src){return new Promise(res=>{try{player.pause();player.src=AUD[src]?'data:audio/mpeg;base64,'+AUD[src]:src;player.onended=res;player.onerror=res;const p=player.play();if(p)p.catch(res)}catch(e){res()}})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setColor(c){document.body.style.setProperty('--c','#'+c);document.documentElement.style.setProperty('--c','#'+c)}
function show(v){for(const s of document.querySelectorAll('.view'))s.classList.toggle('on',s.id===v);scrollTo(0,0)}
// home
function tiles(){
  $('tiles').innerHTML=SECS.map((s,i)=>`<button class="tile" type="button" data-i="${i}" style="--tc:#${s.c}" aria-pressed="${s===cur}" aria-label="${esc(s.en)}"><div><span>${esc(s.l)}</span><small>${esc(s.en.replace('Letter ','').replace(/'/g,''))}</small></div></button>`).join('');

$('tiles').addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;cur=SECS[+b.dataset.i];tiles();

for(const b of document.querySelectorAll('[data-home]'))b.addEventListener('click',()=>{token++;player.pause();show('home')});

let wi=0,paused=false,list=[];
function phHtml(it){return it.img?`<div class="ph${it.kind==='ill'?' ill':''} go-zoom"><img src="${esc(it.img)}" alt="${esc(it.en)}"></div>`:`<div class="ph" style="display:grid;place-items:center"><div style="width:62%;aspect-ratio:1;border-radius:50%;border:22px solid #f9a825"></div></div>`}
function wordSpans(w,hl){if(!hl)return esc(w);let i=1;while(i<w.length&&marks.test(w[i]))i++;return `<b>${esc(w.slice(0,i))}</b>${esc(w.slice(i))}`}
function dots(){$('wDots').innerHTML=list.map((_,i)=>`<b class="${i<=wi?'on':''}"></b>`).join('')}
async function playWord(t){
  const isIntro=wi===0;
  dots();
  if(isIntro){
    const n=cur.n?{au:cur.n}:null;
    $('stage').innerHTML=`<div class="intro"><div class="big go-pop">${esc(cur.l)}</div><h2 class="ar go-up">${esc(cur.ar)}</h2><p>${esc(cur.en)} · ${cur.items.length} words</p></div>`;
    if(n){await wait(500);if(t!==token)return;await say(n.au);await wait(300);if(t!==token)return;await say(n.au)}
    await wait(1800);return;
  }
  const it=list[wi];
  const hl=true;
  $('stage').innerHTML=`<span class="badge go-pop">${esc(cur.l)}</span>${phHtml(it)}<div class="word ar">${wordSpans(it.ar,hl)}</div><div class="pr">${esc(it.pr)}</div><div class="en">${esc(it.en)}</div>`;
  $('stage').classList.remove('go-pop');void $('stage').offsetWidth;$('stage').classList.add('go-pop');
  await wait(450);if(t!==token)return;
  $('stage').querySelector('.word').classList.add('write');

  if(t!==token)return;
  for(const c of ['pr','en'])$('stage').querySelector('.'+c).classList.add('go-up');
  await say(it.au);if(t!==token)return;
  await wait(900);if(t!==token)return;
  await say(it.au);if(t!==token)return;
  await wait(1500);
}

  const t=++token;
  while(wi<list.length&&t===token){
    await playWord(t);
    if(t!==token)return;
    while(paused){await wait(200);if(t!==token)return}
    wi++;
  }
  if(t===token&&wi>=list.length)finish('watch');
}
function startWatch(){list=[null,...cur.items];wi=0;paused=false;setIcon();$('wTitle').textContent=cur.en;show('watch');runWatch()}
function setIcon(){$('wIcon').innerHTML=paused?'<path d="M7 5l12 7-12 7z" fill="#222"/>':'<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="#222"/>';$('wPlay').setAttribute('aria-label',paused?'Play':'Pause')}
$('goWatch').addEventListener('click',startWatch);
$('wPlay').addEventListener('click',()=>{paused=!paused;setIcon();if(paused)player.pause()});
$('wNext').addEventListener('click',()=>{if(wi<list.length-1){wi++;paused=false;setIcon();restart()}});
$('wPrev').addEventListener('click',()=>{if(wi>0){wi--;paused=false;setIcon();restart()}});
$('wAgain').addEventListener('click',()=>{const it=list[wi];if(it)say(it.au)});
function restart(){token++;player.pause();const t=token;(async()=>{while(wi<list.length&&t===token){await playWord(t);if(t!==token)return;while(paused){await wait(200);if(t!==token)return}wi++}if(t===token)finish('watch')})()}
// ---------- PLAY ----------
const ANIMALS=['🐒','🐸','🐱','🐻','🐰','🐼','🦊','🐨','🐯','🦁','🐮','🐷','🐵','🐔','🐧','🐦','🐤','🦉','🐢','🐙','🦒','🦓','🐘','🦔','🐿️','🦘','🐞','🐝'];
// one game per letter (same order as the letters)
const GAMES=[
 {t:'Picture cards',st:'grid',n:4},
 {t:'Balloons',st:'balloon',n:3},
 {t:'Bubbles',st:'bubble',n:3},
 {t:'Fish in the sea',st:'fish',n:3},
 {t:'Clouds in the sky',st:'cloud',n:3},
 {t:'Twinkling stars',st:'star',n:4},
 {t:'The little train',st:'train',n:3},
 {t:'Gift boxes',st:'gift',n:3},
 {t:'Falling pictures',st:'fall',n:3},
 {t:'This or that?',st:'two',n:2},
 {t:'Lily pads in the pond',st:'lily',n:3},
 {t:'Picture frames',st:'frame',n:4},
 {t:'Eggs in the nest',st:'egg',n:3},
 {t:'Beehive',st:'hex',n:4},
 {t:'Book shelf',st:'shelf',n:4},
 {t:'House windows',st:'house',n:4},
 {t:'Flying kites',st:'kite',n:3},
 {t:'TV screens',st:'tv',n:3},
 {t:'Big balloons',st:'balloon',n:2},
 {t:'More bubbles',st:'bubble',n:4},
 {t:'Three cards',st:'grid3',n:3},
 {t:'Fish party',st:'fish',n:2},
 {t:'Star night',st:'star',n:2},
 {t:'Long train',st:'train',n:4},
 {t:'Party gifts',st:'gift',n:2},
 {t:'Pond hop',st:'lily',n:4},
 {t:'Kite festival',st:'kite',n:4},
 {t:'Surprise mix!',mix:true}];
let step=0,answered=false,Q=null,lastPr='',G=null,lastG=-1;
const STEPS=10;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const letterIndex=()=>SECS.indexOf(cur);
const noMarks=w=>w.replace(/[ً-ْٰ]/g,'');
const OTHERS=()=>SECS.filter(s=>s!==cur).flatMap(s=>s.items.filter(x=>x.img));
function placeClimber(dir){
  const c=$('climber');c.textContent=ANIMALS[letterIndex()%ANIMALS.length];
  c.style.bottom=`calc(${step/STEPS*100}% * .86 + 2%)`;
  c.classList.remove('up','down');void c.offsetWidth;if(dir)c.classList.add(dir);
  $('stepTxt').textContent=`${step} / ${STEPS}`;
}
function startPlay(){step=0;show('play');token++;placeClimber();ask()}
function pickWord(){const pool=cur.items.filter(x=>x.img&&x.pr!==lastPr);const it=rnd(pool.length?pool:cur.items);lastPr=it.pr;return it}
function others(n,from,not){return shuffle(from.filter(x=>x.img&&x.pr!==not.pr&&noMarks(x.ar)!==noMarks(not.ar))).slice(0,n)}
const picBtn=(o,i)=>`<button class="opt${o.kind==='ill'?' ill':''}" type="button" data-k="${esc(o.pr)}" data-au="${esc(o.au)}" style="--d:${(i*0.37).toFixed(2)}s;--i:${i}" aria-label="${esc(o.en)}"><img src="${esc(o.img)}" alt=""><span class="lab ar">${esc(o.ar)}</span></button>`;
const wordBtn=(o,i)=>`<button class="wopt ar" type="button" data-k="${esc(o.pr)}" data-au="${esc(o.au)}" style="--d:${(i*0.37).toFixed(2)}s">${esc(o.ar)}</button>`;
const letBtn=(l,i)=>`<button class="lopt ar" type="button" data-k="${esc(l)}" style="--d:${(i*0.2).toFixed(2)}s">${esc(l)}</button>`;
const img=(it,cls='')=>`<img class="qimg ${cls}${it.kind==='ill'?' ill':''}" src="${esc(it.img)}" alt="">`;
const txt=(a,b)=>`<span class="qt">${a}<small>${b}</small></span>`;
function ask(){
  answered=false;
  const gi=letterIndex()%GAMES.length;let g=GAMES[gi];
  if(g.mix){let k;do{k=Math.floor(Math.random()*(GAMES.length-1))}while(k===lastG);lastG=k;g=GAMES[k]}
  g=Object.assign({p:'audio',o:'pics'},g);G=g;$('pTitle').textContent=g.t;
  const it=pickWord();let say0=()=>say(it.au),key=it.pr,P='',opts=[],O=$('opts'),afterSay=it.au;
  const lettersPool=SECS.map(s=>s.l);
  if(g.o==='pics'){
    let list;
    if(g.mode==='starts'){list=shuffle([it,...others(g.n-1,OTHERS(),it)])}
    else if(g.mode==='odd'){const odd=rnd(OTHERS());key=odd.pr;afterSay=odd.au;list=shuffle([odd,...others(g.n-1,cur.items,it).slice(0,g.n-2),it]).slice(0,g.n);if(!list.includes(odd))list[0]=odd;list=shuffle(list)}
    else list=shuffle([it,...others(g.n-1,cur.items,it)]);
    opts=list.map(picBtn);
  }else if(g.o==='words'){
    let list;
    if(g.mode==='oddw'){const odd=rnd(OTHERS());key=odd.pr;afterSay=odd.au;list=shuffle([odd,...others(g.n-1,cur.items,odd)])}
    else list=shuffle([it,...others(g.n-1,cur.items,it)]);
    opts=list.map(wordBtn);
  }else if(g.o==='letters'){
    let target=cur.l;
    if(g.p==='lsound'||g.p==='lshape'){const pool=SECS.filter(s=>s.n);const ts=g.p==='lsound'?rnd(pool):rnd(SECS);target=ts.l;Q={ls:ts}}
    key=target;
    const ls=shuffle([target,...shuffle(lettersPool.filter(l=>l!==target)).slice(0,g.n-1)]);
    opts=ls.map(letBtn);
  }else if(g.o==='yesno'){
    const match=Math.random()<.5;const shown=match?it:rnd(others(1,cur.items,it).concat(others(1,OTHERS(),it)));
    key=match?'yes':'no';Q={shown};
    opts=[`<button class="yn yes" type="button" data-k="yes" aria-label="Yes">✓</button>`,`<button class="yn no" type="button" data-k="no" aria-label="No">✗</button>`];
    if(g.p==='tf'){say0=()=>say(shown.au)}
    afterSay=it.au;
  }
  // prompt
  const p=g.p;
  if(p==='audio')P=txt(g.st==='two'?'Which one do you hear?':'Listen and tap!','Tap the speaker to hear it again');
  else if(p==='image')P=img(it)+txt(g.mode==='first'?'What letter does it start with?':'Which word is it?',g.o==='words'?'Tap a word to hear it':'');
  else if(p==='letter'){P=`<span class="bigl ar">${esc(cur.l)}</span>`+txt(g.mode==='odd'||g.mode==='oddw'?'Which one does NOT start with this letter?':'Which one starts with this letter?','Tap the speaker to hear the letter');say0=()=>{if(cur.n)say(cur.n)}}
  else if(p==='word'){P=`<span class="bigw ar">${esc(it.ar)}</span>`+txt('Read the word','Then tap its picture');say0=()=>{}}
  else if(p==='blur')P=img(it,'blur')+txt('What is it?','It gets clearer…');
  else if(p==='zoom'){P=`<span class="zoomwrap">${img(it,'zoom')}</span>`+txt('What is it?','Look closely!')}
  else if(p==='peek')P=`<span class="peekwrap">${img(it)}<i></i><i></i></span>`+txt('What is behind the curtain?','Watch it open…');
  else if(p==='missing'){const w=it.ar;let i=1;while(i<w.length&&/[ً-ْٰ]/.test(w[i]))i++;P=img(it)+`<span class="bigw ar"><b class="gap">؟</b>${esc(w.slice(i))}</span>`;say0=()=>say(it.au)}
  else if(p==='lsound'){P=txt('Hear the letter','Tap the speaker to hear it again');say0=()=>say(Q.ls.n)}
  else if(p==='lshape'){P=`<span class="bigl ar">${esc(Q.ls.l)}</span>`+txt('Find this letter','');say0=()=>{if(Q.ls.n)say(Q.ls.n)}}
  else if(p==='tf'){P=img(it)+txt('Is this the word you hear?','Tap the speaker to hear it again')}
  else if(p==='tfword'){P=img(it)+`<span class="bigw ar">${esc(Q.shown.ar)}</span>`;say0=()=>{}}
  $('pQ').innerHTML=P;
  O.className='opts st-'+g.st;O.innerHTML=opts.join('');
  for(const b of O.children)b.classList.add('go-pop');
  Q=Object.assign(Q||{},{key,say0,afterSay,it,g});
  setTimeout(()=>{if(Q&&Q.key===key)sayQ()},450);
}
function sayQ(){const b=$('pSay');b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring');Q.say0()}
$('pSay').addEventListener('click',()=>{if(!Q)return;if(['audio','tf','lsound','letter','lshape','missing'].includes(Q.g.p))sayQ();else say(Q.it.au)});
$('opts').addEventListener('click',async e=>{
  const b=e.target.closest('.opt,.wopt,.lopt,.yn');if(!b||answered||b.classList.contains('wrong'))return;
  if(Q.g.st==='cards'&&!b.classList.contains('open')){b.classList.add('open')}
  if(b.dataset.k===Q.key){
    answered=true;b.classList.add('right');step=Math.min(STEPS,step+1);placeClimber('up');burst(b,30);
    const t=token;await say(Q.afterSay);await wait(900);if(t!==token)return;
    if(step>=STEPS)finish('play');else{Q=null;ask()}
  }else{
    b.classList.add('wrong');if(b.dataset.au&&Q.g.o==='words')say(b.dataset.au);
    if(step>0){step--;placeClimber('down')}
    if(Q.g.st==='cards')setTimeout(()=>b.classList.remove('open'),900);
    if(['audio','tf','lsound'].includes(Q.g.p))setTimeout(sayQ,800);
  }
});
$('goPlay').addEventListener('click',startPlay);
// ---------- END ----------
function finish(kind){
  token++;
  const starsN=3;
  const st='<svg viewBox="0 0 24 24" width="58" height="58"><path d="M12 2l3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z" fill="#ffc107"/></svg>';
  $('doneBox').innerHTML=`<div>${st.repeat(starsN)}</div><h2 class="ar">أَحْسَنْتَ!</h2><p style="margin:0;font-weight:800;color:var(--ink)">Well done!</p>`+
   (kind==='play'?`<div class="winner">${ANIMALS[letterIndex()%ANIMALS.length]}</div><p style="font-size:22px;font-weight:800;color:var(--ink)">فُزْتَ! You won!</p><p>Your friend climbed all 10 steps.</p>`:`<p>You watched all ${cur.items.length} words of ${esc(cur.en)}.</p>`)+
   `<button class="pill" type="button" id="again">${kind==='play'?'Play again':'Watch again'}</button><button class="pill" type="button" id="swap">${kind==='play'?'Watch':'Play'}</button><button class="pill alt" type="button" id="toHome">Letters</button>`;
  show('end');burst(null,90);
  $('again').onclick=kind==='play'?startPlay:startWatch;$('swap').onclick=kind==='play'?startWatch:startPlay;$('toHome').onclick=()=>show('home');
}
// ---------- confetti ----------
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],anim=0;
function burst(el,n=40){
  if(reduce)return;
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const r=el?el.getBoundingClientRect():{left:innerWidth/2-20,top:innerHeight/3,width:40,height:40};
  const cols=['#ffc107','#ff5252','#40c4ff','#69f0ae','#e040fb','#fff'];
  for(let i=0;i<n;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:6+Math.random()*8,c:cols[i%cols.length],a:Math.random()*6,l:70+Math.random()*30,star:i%3===0});
  if(!anim)tick();
}
function starPath(x,y,r){cx.beginPath();for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r/2.2:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.closePath()}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.a+=.2;p.l--;cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);
    if(p.star){starPath(p.x,p.y,p.s);cx.fill()}else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}}
  cx.globalAlpha=1;
  anim=parts.length?requestAnimationFrame(tick):0;
}
tiles();
$('cred').innerHTML=D.cred.map(([k,f])=>`<li><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(f)}">${esc(f)}</a></li>`).join('');
}
